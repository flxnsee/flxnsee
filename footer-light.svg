<text x="500" y="44" class="sans fg" font-size="20" font-weight="700" text-anchor="middle">Thanks for riding along.</text>
<text x="500" y="70" class="mono mu" font-size="12" text-anchor="middle">This page rebuilds itself every 2 hours · last train left 31 Oct, 14:20 Kyiv time</text>
