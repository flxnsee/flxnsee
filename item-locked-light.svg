<text x="68" y="146" class="mono mu" font-size="11" text-anchor="middle" letter-spacing="1.5">LOCKED</text>
<text x="132" y="62" class="sans fg" font-size="21" font-weight="700">next quest loading<tspan style="animation:caret 1.5s 0.0s infinite">.</tspan><tspan style="animation:caret 1.5s 0.5s infinite">.</tspan><tspan style="animation:caret 1.5s 1.0s infinite">.</tspan></text>
