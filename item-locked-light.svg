<svg xmlns="http://www.w3.org/2000/svg" width="500" height="180" viewBox="0 0 500 180" role="img" aria-label="Locked slot: next project in progress">
<title>Locked slot: next project in progress</title>
<style>
.sans{font-family:'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace}
.fg{fill:#1d1a24} .mu{fill:#7a7386}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.floaty{animation:floaty 3.2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="6" y="6" width="488" height="168" rx="18" fill="none" stroke="#e6dfd2" stroke-width="1.5" stroke-dasharray="7 7">
<animate attributeName="stroke-dashoffset" values="0;28" dur="2s" repeatCount="indefinite"/></rect>
<rect x="24" y="30" width="88" height="88" rx="14" fill="#f7f3ec" stroke="#e6dfd2"/>
